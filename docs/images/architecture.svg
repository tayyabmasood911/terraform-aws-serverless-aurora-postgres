<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="70" y="60" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="0.3">AWS Aurora Serverless v2 PostgreSQL &amp; RDS Proxy Architecture</text>
  <rect x="910" y="40" width="110" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="925" y="58" fill="#047857" font-size="12" font-weight="600">PRODUCTION</text>
  <rect x="1030" y="40" width="100" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1045" y="58" fill="#1d4ed8" font-size="12" font-weight="600">TERRAFORM</text>

  <!-- COLUMN 1: Client Ingress & Compute -->
  <rect x="40" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="40" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="60" y="136" fill="#0284c7" font-size="13" font-weight="700">1. CLIENT COMPUTE LAYER</text>

  <rect x="60" y="170" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="198" fill="#0f172a" font-size="14" font-weight="600">AWS Lambda Functions</text>
  <text x="75" y="222" fill="#64748b" font-size="11">Ephemeral High-Concurrency</text>

  <rect x="60" y="260" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="288" fill="#0f172a" font-size="14" font-weight="600">Amazon EKS Pods</text>
  <text x="75" y="312" fill="#64748b" font-size="11">Microservices Workloads</text>

  <rect x="60" y="350" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="378" fill="#0f172a" font-size="14" font-weight="600">Private VPC Subnets</text>
  <text x="75" y="402" fill="#64748b" font-size="11">Non-Routable Internal CIDR</text>

  <rect x="60" y="440" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="468" fill="#0f172a" font-size="14" font-weight="600">IAM Auth Tokens</text>
  <text x="75" y="492" fill="#64748b" font-size="11">Zero-Trust Credential Injection</text>

  <!-- COLUMN 2: RDS Proxy & Security -->
  <rect x="330" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="330" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="350" y="136" fill="#6366f1" font-size="13" font-weight="700">2. MANAGED RDS PROXY</text>

  <rect x="350" y="170" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="365" y="198" fill="#0f172a" font-size="14" font-weight="600">Connection Multiplexer</text>
  <text x="365" y="222" fill="#64748b" font-size="11">Pools Thousands of Clients</text>

  <rect x="350" y="260" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="365" y="288" fill="#0f172a" font-size="14" font-weight="600">Sub-second Failover</text>
  <text x="365" y="312" fill="#64748b" font-size="11">Automated Writer Re-routing</text>

  <rect x="350" y="350" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="365" y="378" fill="#0f172a" font-size="14" font-weight="600">AWS Secrets Manager</text>
  <text x="365" y="402" fill="#64748b" font-size="11">Managed DB Password Rotation</text>

  <rect x="350" y="440" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="365" y="468" fill="#0f172a" font-size="14" font-weight="600">Mandatory TLS 1.3</text>
  <text x="365" y="492" fill="#64748b" font-size="11">Strict In-Transit Encryption</text>

  <!-- COLUMN 3: Serverless v2 Multi-AZ Engine -->
  <rect x="620" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="620" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="640" y="136" fill="#d97706" font-size="13" font-weight="700">3. AURORA SERVERLESS V2</text>

  <rect x="640" y="170" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="655" y="198" fill="#0f172a" font-size="14" font-weight="600">Primary Writer (AZ-1)</text>
  <text x="655" y="222" fill="#64748b" font-size="11">0.5 to 16.0 ACU Autoscaling</text>

  <rect x="640" y="260" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="655" y="288" fill="#0f172a" font-size="14" font-weight="600">Read Replica (AZ-2)</text>
  <text x="655" y="312" fill="#64748b" font-size="11">Instant Hot-Standby Failover</text>

  <rect x="640" y="350" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="655" y="378" fill="#0f172a" font-size="14" font-weight="600">Engine: PostgreSQL 15.4</text>
  <text x="655" y="402" fill="#64748b" font-size="11">Optimized Query Execution</text>

  <rect x="640" y="440" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="655" y="468" fill="#0f172a" font-size="14" font-weight="600">Database Subnet Group</text>
  <text x="655" y="492" fill="#64748b" font-size="11">Multi-AZ Isolated Boundaries</text>

  <!-- COLUMN 4: Distributed Storage & Telemetry -->
  <rect x="910" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="910" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="930" y="136" fill="#059669" font-size="13" font-weight="700">4. STORAGE &amp; TELEMETRY</text>

  <rect x="930" y="170" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="945" y="198" fill="#0f172a" font-size="14" font-weight="600">6-Way Replicated Storage</text>
  <text x="945" y="222" fill="#64748b" font-size="11">Aurora Cluster Storage across 3 AZs</text>

  <rect x="930" y="260" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="945" y="288" fill="#0f172a" font-size="14" font-weight="600">AWS KMS Customer Key</text>
  <text x="945" y="312" fill="#64748b" font-size="11">Envelope Encryption at Rest</text>

  <rect x="930" y="350" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="945" y="378" fill="#0f172a" font-size="14" font-weight="600">Enhanced Monitoring</text>
  <text x="945" y="402" fill="#64748b" font-size="11">1-Second OS Performance Metrics</text>

  <rect x="930" y="440" width="210" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="945" y="468" fill="#0f172a" font-size="14" font-weight="600">CloudWatch Logs Export</text>
  <text x="945" y="492" fill="#64748b" font-size="11">PostgreSQL Slow &amp; Error Logs</text>

  <!-- Connectors -->
  <path d="M 290 205 L 330 205" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 580 205 L 620 205" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 870 205 L 910 205" stroke="#94a3b8" stroke-width="2"/>

  <path d="M 290 385 L 330 385" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 580 385 L 620 385" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 870 385 L 910 385" stroke="#94a3b8" stroke-width="2"/>
</svg>
